conversation_mode: audio+chat
output_mode: both
autonomous_mode: false
model:
  policy: local_only
  tier0_enabled: true
  tier0_model: llama3.2:3b
  local_text_model: gemma4:12b
  local_vision_model: qwen2.5vl:7b
  cloud_model: gemini-2.5-flash
  ollama_url: http://localhost:11434
  keep_alive: -1
  gemini_api_key: null
voice:
  enabled: true
  whisper_model: base
  device: cuda
  compute_type: float16
  tts_voice: en-GB-RyanNeural
  tts_rate: +2%
  tts_pitch: -4Hz
  always_voice_response: false
  voice_reply_on_chat: true
safety:
  prompt_on_high_stakes: true
  high_stakes_keywords:
  - rm -rf
  - delete
  - destroy
  - wipe
  - format
  - sudo
  - passwd
  - shutdown
  - reboot
  - send email
  - payment
  - buy
  - purchase
  - checkout
  - order
  - transfer
  - bank
  - credit card
  - telegram send
  - post to
browser:
  headless: false
  viewport_width: 1280
  viewport_height: 800
  user_data_dir: ~/.jarvis/browser_data
  cdp_port: 9222
memory:
  memory_dir: ~/.jarvis/memory
watchdogs:
  sentinel:
    enabled: true
    check_interval_seconds: 30
    gpu_temp_threshold: 80
    disk_threshold_percent: 90
  organizer:
    enabled: false
    watch_dir: ~/Downloads
    rules:
      pdf: ~/Documents/PDFs
      csv,xlsx,json: ~/Documents/Data
      tar.gz,zip,rar,7z: ~/Downloads/Archives
      mp4,mkv,avi: ~/Media/Videos
      png,jpg,jpeg,webp: ~/Media/Images
  cron:
    enabled: false
    briefing_time: 08:30
web_ui:
  host: 127.0.0.1
  port: 8765
spotlight:
  enabled: true
  hotkey: <alt>+j
desktop:
  screen_index: 1

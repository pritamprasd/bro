name: CI / Build & Test Verification

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Build & Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            x11-utils \
            ffmpeg \
            espeak-ng \
            portaudio19-dev \
            libnotify-bin \
            libegl1 \
            libgl1-mesa-dev

      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: 🐍 Set Up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: ⚙️ Setup Environment Config
        run: |
          cp .env.example .env

      - name: 📦 Install Python Dependencies
        run: |
          uv sync

      - name: 🎭 Install Playwright Browsers
        run: |
          uv run playwright install chromium

      - name: 🏗️ Validate Package Build
        run: |
          uv build

      - name: 🧪 Execute Automated Pytest Suite
        run: |
          xvfb-run -a uv run pytest -v

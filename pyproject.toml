[project]
name = "jarvis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pritam Prasad", email = "5097255+pritamprasd@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "edge-tts>=7.2.8",
    "faster-whisper>=1.2.1",
    "google-genai>=2.24.0",
    "keyring>=25.7.0",
    "mss>=10.2.0",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "pyautogui>=0.9.54",
    "pydantic>=2.13.5",
    "pynput>=1.8.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sounddevice>=0.5.6",
    "typer>=0.27.2",
]

[project.scripts]
jarvis = "jarvis:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
